<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARPULSE 車聚影像智能查詢系統</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: {
        darkbg: '#090a0f',
        igcard: '#121212',
        igborder: '#262626'
      }
    }
  }
}
</script>
<style>
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .ring-active { ring-color: #3b82f6 !important; ring-width: 2px !important; ring-offset-width: 2px !important; ring-offset-color: #090a0f !important; }
</style>
</head>
<body class="min-h-screen bg-[#090a0f] text-gray-100 flex flex-col justify-between selection:bg-indigo-600 selection:text-white">

<header class="border-b border-gray-800 bg-[#0c0e15]/85 backdrop-blur-md sticky top-0 z-40">
  <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToSearch()">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-gray-200 to-gray-400 flex items-center justify-center shadow-lg shadow-gray-500/20">
        <svg class="w-6 h-6 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wider text-white font-mono">CARPULSE</h1>
        <p class="text-[10px] text-gray-500 tracking-widest uppercase">Digital Vault</p>
      </div>
    </div>
    <span class="text-[10px] font-medium text-emerald-400 bg-emerald-950 px-2.5 py-1 rounded-lg border border-emerald-800/50">SECURE VAULT v4.3</span>
  </div>
</header>

<main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
  
  <div id="search-container" class="transition-all duration-300">
    <div class="text-center max-w-2xl mx-auto mb-12">
      <span class="inline-flex items-center space-x-2 px-3 py-1 rounded-full text-[10px] font-semibold bg-gray-900/80 text-gray-400 border border-gray-800 mb-4 tracking-widest uppercase shadow-inner">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        <span>PUBLIC PREVIEW & SECURE VAULT</span>
      </span>
      <h2 class="text-3xl font-extrabold text-white tracking-widest mb-3 font-mono drop-shadow-lg">車聚精彩影像智搜</h2>
      <p class="text-gray-400 text-sm tracking-wide">輸入車牌即可免費預覽活動相簿，下載高畫質原圖或解鎖專屬數位車庫。</p>
    </div>

    <div class="max-w-xl mx-auto bg-[#0c0e15] border border-gray-800 rounded-2xl p-6 sm:p-8 shadow-[0_0_40px_rgba(0,0,0,0.8)] relative overflow-hidden">
      <form id="search-form" class="space-y-5 relative z-10">
        <div>
          <label for="plate-input" class="block text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-2">車牌號碼 (SEARCH PLATE)</label>
          <input type="text" id="plate-input" placeholder="例: BHS0759" class="w-full bg-black/80 border border-gray-700 rounded-xl px-4 py-4 text-white placeholder-gray-700 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition uppercase font-mono tracking-[0.2em] text-xl text-center" required autocomplete="off">
        </div>
        <button type="submit" id="submit-btn" class="w-full bg-gray-100 hover:bg-white text-black font-bold py-4 px-4 rounded-xl shadow-lg transition flex items-center justify-center space-x-2 mt-4 tracking-widest cursor-pointer">
          <span id="btn-text">立即檢索相簿 (SEARCH)</span>
          <svg id="btn-spinner" class="w-5 h-5 animate-spin hidden text-black" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
        </button>
      </form>
    </div>

    <div id="error-toast" class="max-w-xl mx-auto mt-6 hidden opacity-0 transition-opacity duration-300">
      <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-center space-x-3 text-red-400">
        <span id="error-msg" class="text-sm font-medium">錯誤提示訊息</span>
      </div>
    </div>

    <div id="home-grid-section" class="max-w-4xl mx-auto mt-20">
      <div class="flex items-center justify-between border-b border-gray-800 pb-4 mb-6">
        <h3 class="text-lg font-bold text-white tracking-wide">精選車輛主頁牆</h3>
      </div>
      <div id="car-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
    </div>
  </div>

  <section id="gallery-section" class="mt-2 hidden max-w-2xl mx-auto">
    <div class="bg-igcard border border-igborder rounded-2xl p-5 mb-6 shadow-xl relative overflow-hidden">
      <div class="absolute top-0 right-0 p-4">
        <button onclick="resetToSearch()" class="text-xs text-gray-400 hover:text-white transition bg-gray-900/50 px-3 py-1.5 rounded-lg border border-gray-800">返回檢索大門</button>
      </div>

      <div class="flex items-center justify-between mb-4 mt-6">
        <div class="flex items-center space-x-4">
          <div class="relative">
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full p-[2px] bg-gradient-to-tr from-gray-500 via-gray-400 to-white shadow-lg">
              <img id="profile-avatar" src="" alt="Avatar" class="w-full h-full object-cover rounded-full bg-black border-2 border-black">
            </div>
          </div>
          <div>
            <h3 id="profile-title" class="text-base sm:text-lg font-bold text-white tracking-widest font-mono">BHS0759</h3>
            <p class="text-[10px] text-gray-500 mt-0.5 tracking-widest uppercase">Verified Showcase</p>
          </div>
        </div>
      </div>

      <div class="text-xs sm:text-sm text-gray-300 space-y-1 mb-4 bg-black/60 border border-gray-800 p-4 rounded-xl shadow-inner font-mono tracking-wide">
        <div id="profile-bio" class="whitespace-pre-line leading-relaxed">載入車輛介紹中...</div>
      </div>

      <div id="auth-banner" class="bg-gradient-to-r from-emerald-950/60 to-gray-900 border border-emerald-500/30 rounded-xl p-3.5 flex items-center justify-between text-xs shadow-md">
        <div class="flex items-center space-x-2.5">
          <svg class="w-5 h-5 text-emerald-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          <div>
            <span id="auth-status-text" class="font-bold text-white block">訪客預覽模式 (可瀏覽預覽與縮圖)</span>
            <span class="text-[10px] text-emerald-400">車主本人驗證下載高畫質原圖</span>
          </div>
        </div>
        <button id="auth-action-btn" onclick="triggerLineLogin()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-2 rounded-lg transition tracking-widest text-[10px] uppercase whitespace-nowrap cursor-pointer">
          解鎖完整數位車庫
        </button>
      </div>
    </div>

    <div id="albums-container" class="py-2 mb-4 flex space-x-5 overflow-x-auto no-scrollbar pl-2"></div>
    <div id="results-container" class="grid grid-cols-3 gap-1 bg-black rounded-xl overflow-hidden shadow-2xl min-h-[200px]"></div>
  </section>
</main>

<div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/98 backdrop-blur-xl hidden opacity-0 transition-opacity duration-300 flex flex-col justify-between">
  <div class="flex items-center justify-between p-4 border-b border-gray-900 bg-black/50">
    <div class="flex items-center space-x-3">
      <h4 id="lb-plate" class="text-xs font-bold text-white font-mono tracking-widest">BHS0759</h4>
    </div>
    <button id="close-lightbox" class="text-gray-500 hover:text-white p-2 transition cursor-pointer">✕</button>
  </div>
  <div class="flex-grow flex items-center justify-center p-2 relative" id="lightbox-bg-area">
    <img id="lightbox-img" src="" alt="Post Detail" class="max-h-[80vh] max-w-full object-contain drop-shadow-2xl">
  </div>
  <div class="p-4 border-t border-gray-900 bg-[#090a0f] flex items-center justify-between">
    <span id="lb-counter" class="text-black font-bold bg-gray-300 px-2 py-0.5 rounded text-[10px]">1/1</span>
    <button onclick="handleDownloadClick()" class="bg-gray-200 hover:bg-white text-black text-[11px] font-bold px-4 py-2.5 rounded-lg transition shadow-lg cursor-pointer">
      提取高畫質原圖
    </button>
  </div>
</div>

<script>
const NAS_DOMAIN = 'https://images.carpuse.cc';

const form = document.getElementById('search-form');
const plateInput = document.getElementById('plate-input');
const submitBtn = document.getElementById('submit-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');
const errorToast = document.getElementById('error-toast');
const errorMsg = document.getElementById('error-msg');
const searchContainer = document.getElementById('search-container');
const gallerySection = document.getElementById('gallery-section');
const resultsContainer = document.getElementById('results-container');
const albumsContainer = document.getElementById('albums-container');

let isAuthorizedOwner = false;
let currentGalleryPhotos = [];
let currentGalleryIndex = 0;
let currentGalleryPlate = '';

window.addEventListener('DOMContentLoaded', async () => {
    const urlParams = new URLSearchParams(window.location.search);
    const rawUrlPlate = urlParams.get('plate');
    const authStatus = urlParams.get('auth');
    
    if (rawUrlPlate) {
        // 關鍵修復：嚴格過濾純車牌，把後面的車型與斜線全部切掉
        const cleanPlate = rawUrlPlate.split('/')[0].trim().toUpperCase();
        plateInput.value = cleanPlate;

        if (authStatus === 'success') {
            isAuthorizedOwner = true;
        }

        await loadAndDisplayVault(cleanPlate);
    } else {
        loadHomeGrid();
    }
});

async function loadHomeGrid() {
    const gridContainer = document.getElementById('car-grid');
    if (!gridContainer) return;
    try {
        const res = await fetch(`${NAS_DOMAIN}/cars.json?t=${Date.now()}`);
        if (!res.ok) throw new Error();
        const cars = await res.json();
        gridContainer.innerHTML = '';
        cars.forEach(car => {
            const cleanCarPlate = car.plate.split('/')[0].trim().toUpperCase();
            const card = `
                <div onclick="quickSelectPlate('${cleanCarPlate}')" class="group relative block aspect-square rounded-2xl overflow-hidden bg-[#0c0e15] border border-gray-800 cursor-pointer shadow-lg hover:border-gray-500 transition-all">
                    <img src="${NAS_DOMAIN}/${car.cover}" class="w-full h-full object-cover group-hover:scale-105 transition duration-700 opacity-90" onerror="this.src='https://placehold.co/400x400/121212/ffffff?text=${cleanCarPlate}'">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/95 to-transparent flex flex-col justify-end p-4">
                        <h4 class="text-base font-bold text-white font-mono tracking-widest">${cleanCarPlate}</h4>
                    </div>
                </div>
            `;
            gridContainer.insertAdjacentHTML('beforeend', card);
        });
    } catch (err) {
        gridContainer.innerHTML = `<div class="col-span-full py-12 text-center text-gray-600 text-xs font-mono">VAULT OFFLINE</div>`;
    }
}

function quickSelectPlate(plate) {
    const cleanPlate = plate.split('/')[0].trim().toUpperCase();
    plateInput.value = cleanPlate;
    form.dispatchEvent(new Event('submit'));
}

form.addEventListener('submit', (e) => {
    e.preventDefault();
    const rawInput = plateInput.value.trim();
    if (!rawInput) return;

    // 關鍵修復：提交時強制取純車牌
    const cleanPlate = rawInput.split('/')[0].trim().toUpperCase();
    plateInput.value = cleanPlate;

    window.history.pushState({}, '', `/?plate=${encodeURIComponent(cleanPlate)}`);
    loadAndDisplayVault(cleanPlate);
});

async function loadAndDisplayVault(plate) {
    try {
        const profileRes = await fetch(`${NAS_DOMAIN}/${plate}/profile.json?t=${Date.now()}`);
        if (!profileRes.ok) throw new Error(`查無此車牌號碼「${plate}」的活動相簿記錄。`);
        const profileData = await profileRes.json();
        const albums = profileData.albums || [];

        renderIGProfile(profileData, plate);
        renderAlbums(albums, plate);

        searchContainer.classList.add('hidden');
        gallerySection.classList.remove('hidden');
    } catch (err) {
        errorMsg.textContent = err.message;
        errorToast.classList.remove('hidden');
        setTimeout(() => errorToast.classList.add('opacity-0'), 5000);
    }
}

function renderIGProfile(profile, plate) {
    document.getElementById('profile-title').textContent = profile.name ? profile.name : plate;
    document.getElementById('profile-bio').textContent = profile.bio || `🏎️ ARCHIVE ID：${plate}`;
    if (profile.avatar) {
        document.getElementById('profile-avatar').src = `${NAS_DOMAIN}/${plate}/${profile.avatar}`;
    }

    const authBanner = document.getElementById('auth-banner');
    const authStatusText = document.getElementById('auth-status-text');
    const authActionBtn = document.getElementById('auth-action-btn');

    if (isAuthorizedOwner) {
        authStatusText.textContent = "✅ 車主專屬身分已驗證 (數位車庫全面解鎖)";
        authActionBtn.textContent = "已解鎖";
        authActionBtn.disabled = true;
        authActionBtn.className = "bg-gray-800 text-gray-400 font-bold px-3 py-2 rounded-lg text-[10px] uppercase cursor-default";
        authBanner.className = "bg-gradient-to-r from-emerald-950 to-emerald-900 border border-emerald-500/50 rounded-xl p-3.5 flex items-center justify-between text-xs shadow-md";
    }
}

function triggerLineLogin() {
    let plate = plateInput.value.trim().split('/')[0].trim().toUpperCase();
    window.location.href = `/api/login?plate=${plate}`;
}

function renderAlbums(albums, plate) {
    albumsContainer.innerHTML = '';
    albums.forEach((album, index) => {
        const coverUrl = album.cover ? `${NAS_DOMAIN}/${plate}/${album.cover}` : 'https://placehold.co/200x200';
        const div = document.createElement('div');
        div.className = "flex flex-col items-center flex-shrink-0 cursor-pointer group w-16 sm:w-20";
        div.innerHTML = `
            <div class="ring-wrapper w-14 h-14 sm:w-16 sm:h-16 rounded-full p-[2px] bg-gray-800 group-hover:bg-emerald-400 transition">
                <img src="${coverUrl}" class="w-full h-full object-cover rounded-full">
            </div>
            <span class="text-[10px] text-gray-400 mt-2 truncate w-full text-center">${album.title || '檔案'}</span>
        `;
        div.addEventListener('click', () => renderGallery(album.photos || [], plate));
        albumsContainer.appendChild(div);
    });
    if (albums.length > 0) albumsContainer.firstChild.click();
}

function renderGallery(photos, plate) {
    resultsContainer.innerHTML = '';
    currentGalleryPhotos = photos;
    currentGalleryPlate = plate;

    photos.forEach((path, index) => {
        const div = document.createElement('div');
        div.className = "aspect-square bg-black relative group cursor-pointer overflow-hidden border border-gray-900";
        div.innerHTML = `<img src="${NAS_DOMAIN}/${plate}/${path}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition">`;
        div.addEventListener('click', () => {
            currentGalleryIndex = index;
            document.getElementById('lightbox-img').src = `${NAS_DOMAIN}/${plate}/${path}`;
            document.getElementById('lightbox-modal').classList.remove('hidden');
            setTimeout(() => document.getElementById('lightbox-modal').classList.remove('opacity-0'), 10);
        });
        resultsContainer.appendChild(div);
    });
}

function handleDownloadClick() {
    const path = currentGalleryPhotos[currentGalleryIndex];
    const imgUrl = `${NAS_DOMAIN}/${currentGalleryPlate}/${path}`;
    if (isAuthorizedOwner) {
        window.open(imgUrl, '_blank');
    } else {
        document.getElementById('lightbox-modal').classList.add('opacity-0');
        setTimeout(() => document.getElementById('lightbox-modal').classList.add('hidden'), 300);
        alert("🔒 為了保護車主隱私，下載高畫質原圖需通過 LINE 身分驗證。");
    }
}

document.getElementById('close-lightbox').addEventListener('click', () => {
    document.getElementById('lightbox-modal').classList.add('opacity-0');
    setTimeout(() => document.getElementById('lightbox-modal').classList.add('hidden'), 300);
});
</script>
</body>
</html>
