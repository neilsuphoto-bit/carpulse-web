<!-- Lightbox 劇院模式（大圖優先版） -->
<div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/98 backdrop-blur-xl hidden opacity-0 transition-opacity duration-300 flex flex-col justify-between">
  
  <!-- 頂部精簡導航列 -->
  <div class="flex items-center justify-between px-6 py-3 border-b border-gray-900 bg-black/60 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-7 h-7 rounded-full bg-gray-800 overflow-hidden ring-1 ring-gray-700">
        <img id="lb-avatar" src="" class="w-full h-full object-cover">
      </div>
      <div>
        <h4 id="lb-plate" class="text-xs font-bold text-white font-mono tracking-widest">BHS0759</h4>
        <p class="text-[9px] text-gray-500 uppercase tracking-widest">CARPULSE SECURE VAULT</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-4">
      <span id="lb-counter" class="text-[10px] font-mono text-gray-400 bg-gray-900 px-2.5 py-1 rounded-md border border-gray-800">1 / 1</span>
      <button id="close-lightbox" class="text-gray-400 hover:text-white p-1.5 transition rounded-lg hover:bg-gray-900">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>
  </div>

  <!-- 主體區域：大圖極大化，右側為極簡側邊欄 -->
  <div class="flex-grow flex flex-col lg:flex-row items-center justify-between p-3 sm:p-6 overflow-hidden relative gap-4" id="lightbox-bg-area">
    
    <!-- 左側：照片最大化展示區 (佔近 80% 視覺空間) -->
    <div class="flex-grow h-full w-full lg:w-[75%] flex items-center justify-center relative">
      <button id="lb-prev" class="absolute left-2 sm:left-4 p-2.5 bg-black/60 hover:bg-white hover:text-black text-gray-300 rounded-full transition-all backdrop-blur z-40 focus:outline-none border border-gray-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      </button>
      
      <img id="lightbox-img" src="" alt="Post Detail" class="max-h-[82vh] max-w-full object-contain drop-shadow-2xl z-30 rounded-lg">
      
      <button id="lb-next" class="absolute right-2 sm:right-4 p-2.5 bg-black/60 hover:bg-white hover:text-black text-gray-300 rounded-full transition-all backdrop-blur z-40 focus:outline-none border border-gray-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
      </button>
    </div>

    <!-- 右側：精簡側邊欄 (車輛資訊 + 低調質感攝影師名片) -->
    <div class="w-full lg:w-[260px] flex-shrink-0 bg-[#0d0f17] border border-gray-800/80 rounded-xl p-4 flex flex-col justify-between text-white shadow-2xl">
      
      <!-- 上半部：檔案與檔案名稱 -->
      <div>
        <div class="text-[9px] font-mono text-gray-500 uppercase tracking-widest mb-1">FILE INFO</div>
        <div id="lb-filename" class="text-xs font-mono text-gray-300 truncate bg-black/40 px-2.5 py-1.5 rounded-lg border border-gray-800 mb-3">filename.jpg</div>
        
        <div class="space-y-1.5 text-[11px] text-gray-400 font-mono border-t border-gray-800/60 pt-3">
          <div class="flex justify-between"><span>檢索狀態</span><span class="text-emerald-400">SECURE OK</span></div>
        </div>
      </div>

      <!-- 下半部：攝影師低調質感名片與社群按鈕 -->
      <div class="border-t border-gray-800/80 pt-3 mt-3">
        <div class="text-[9px] text-gray-500 uppercase tracking-widest mb-1.5 font-mono flex items-center justify-between">
          <span>PHOTOGRAPHER</span>
          <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>
        </div>
        
        <div class="bg-black/60 p-2.5 rounded-lg border border-gray-800 space-y-2">
          <div class="flex items-center space-x-2">
            <div class="w-6 h-6 rounded-full bg-gradient-to-tr from-amber-500 to-indigo-600 flex items-center justify-center text-[10px] font-bold text-white">N</div>
            <span id="lb-photographer-name" class="text-xs font-bold text-white">Neilsu Photo</span>
          </div>

          <!-- 緊湊型社群導流按鈕 -->
          <div class="grid grid-cols-3 gap-1.5 pt-0.5">
            <a id="lb-ig-link" href="https://instagram.com/neilsu_photo" target="_blank" class="bg-purple-950/60 hover:bg-purple-900 text-purple-200 text-[10px] font-bold py-1.5 rounded text-center transition border border-purple-800/50 block tracking-wider">
              IG
            </a>
            <a id="lb-fb-link" href="https://facebook.com/neilsuphoto" target="_blank" class="bg-blue-950/60 hover:bg-blue-900 text-blue-200 text-[10px] font-bold py-1.5 rounded text-center transition border border-blue-800/50 block tracking-wider">
              FB
            </a>
            <a id="lb-web-link" href="https://carpuse.cc" target="_blank" class="bg-gray-800 hover:bg-gray-700 text-gray-300 text-[10px] font-bold py-1.5 rounded text-center transition border border-gray-700 block tracking-wider">
              官網
            </a>
          </div>
        </div>
      </div>

      <!-- 底部：提取原圖按鈕 (主動召喚區) -->
      <div class="mt-3">
        <a id="download-btn" href="" target="_blank" download class="w-full bg-gray-100 hover:bg-white text-black text-[11px] font-bold py-2.5 rounded-lg transition shadow-md flex items-center justify-center space-x-1.5 tracking-widest">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
          <span>提取高畫質原圖</span>
        </a>
      </div>

    </div>

  </div>
</div>
