<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CARPULSE 車聚影像查詢系統</title>
<!-- 使用 Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: {
    extend: {
      colors: { darkbg: '#090a0f' }
    }
  }
}
</script>
<style>
.masonry-grid {
  column-count: 1;
  column-gap: 1.5rem;
}
@media (min-width: 640px) { .masonry-grid { column-count: 2; } }
@media (min-width: 1024px) { .masonry-grid { column-count: 3; } }
.masonry-item {
  break-inside: avoid;
  margin-bottom: 1.5rem;
}
</style>
</head>
<body class="min-h-screen bg-[#090a0f] text-gray-100 flex flex-col justify-between selection:bg-blue-600 selection:text-white">

<header class="border-b border-gray-800 bg-[#0c0e15]/85 backdrop-blur-md sticky top-0 z-40">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wider text-white">CARPULSE</h1>
        <p class="text-xs text-gray-400">車聚影像智能查詢系統</p>
      </div>
    </div>
    <span class="text-xs font-medium text-blue-400 bg-blue-500/10 px-3 py-1.5 rounded-lg border border-blue-500/20">v2.1 NAS 直連版</span>
  </div>
</header>

<main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 w-full">
  <div class="text-center max-w-2xl mx-auto mb-12">
    <span class="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-4">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-400 animate-pulse"></span>
      <span>2026 年度車聚官方影像庫</span>
    </span>
    <h2 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight mb-3">尋找您的愛車精采瞬間</h2>
    <p class="text-gray-400 text-sm sm:text-base">請輸入您的車牌號碼，系統將自動解鎖 NAS 對應資料夾寫真照。</p>
  </div>

  <!-- Search Box -->
  <div class="max-w-xl mx-auto bg-[#13151f] border border-gray-800/80 rounded-2xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
    <div class="absolute -right-20 -top-20 w-40 h-40 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>
    <form id="search-form" class="space-y-5 relative z-10">
      <div>
        <label for="plate-input" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">車牌號碼 (Plate Number)</label>
        <input type="text" id="plate-input" placeholder="例如: BHS0759" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3.5 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition uppercase font-mono tracking-wider text-lg" required autocomplete="off">
      </div>
      <button type="submit" id="submit-btn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-medium py-3.5 px-4 rounded-xl shadow-lg shadow-blue-600/30 transition flex items-center justify-center space-x-2 mt-4">
        <span id="btn-text">立即查詢影像</span>
        <svg id="btn-spinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path></svg>
      </button>
    </form>
  </div>

  <!-- Error Toast -->
  <div id="error-toast" class="max-w-xl mx-auto mt-6 hidden opacity-0 transition-opacity duration-300">
    <div class="bg-red-500/10 border border-red-500/30 rounded-xl p-4 flex items-center space-x-3 text-red-400">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <span id="error-msg" class="text-sm font-medium">錯誤提示訊息</span>
    </div>
  </div>

  <!-- Gallery Section -->
  <section id="gallery-section" class="mt-16 hidden">
    <div class="flex items-center justify-between mb-8 border-b border-gray-800 pb-4">
      <h3 id="event-title" class="text-xl font-bold text-white tracking-wide">車牌：<span id="target-plate" class="text-blue-400 font-mono"></span> 的專屬相簿</h3>
      <span class="text-xs text-gray-400">支援點擊圖片檢視原圖與下載</span>
    </div>
    <div id="results-container" class="masonry-grid">
      <!-- 動態載入相片處 -->
    </div>
  </section>
</main>

<!-- Lightbox Modal -->
<div id="lightbox-modal" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
  <button id="close-lightbox" class="absolute top-6 right-6 text-gray-400 hover:text-white bg-gray-800/80 hover:bg-gray-700 p-2.5 rounded-full transition z-10">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
  </button>
  <div class="max-w-5xl max-h-[90vh] flex flex-col items-center">
    <img id="lightbox-img" src="" alt="Enlarged photo" class="max-h-[75vh] max-w-full object-contain rounded-lg shadow-2xl mb-4">
    <a id="download-btn" href="" target="_blank" download class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2.5 rounded-xl shadow-lg transition flex items-center space-x-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      <span>下載原始檔 (Download Original)</span>
    </a>
  </div>
</div>

<footer class="border-t border-gray-800/80 bg-[#090a0f] py-6 text-center text-xs text-gray-500">
  <p>© 2026 CARPULSE. All rights reserved. Powered by Cloudflare Tunnel & NAS.</p>
</footer>

<script>
// 設定你的 Cloudflare 對外公開圖床網域
const NAS_DOMAIN = 'https://images.carpuse.cc';

const form = document.getElementById('search-form');
const plateInput = document.getElementById('plate-input');
const submitBtn = document.getElementById('submit-btn');
const btnText = document.getElementById('btn-text');
const btnSpinner = document.getElementById('btn-spinner');
const errorToast = document.getElementById('error-toast');
const errorMsg = document.getElementById('error-msg');
const gallerySection = document.getElementById('gallery-section');
const resultsContainer = document.getElementById('results-container');
const targetPlateSpan = document.getElementById('target-plate');

const lightboxModal = document.getElementById('lightbox-modal');
const lightboxImg = document.getElementById('lightbox-img');
const downloadBtn = document.getElementById('download-btn');
const closeLightbox = document.getElementById('close-lightbox');

let errorTimeout;

function showError(msg) {
  errorMsg.textContent = msg;
  errorToast.classList.remove('hidden');
  requestAnimationFrame(() => errorToast.classList.remove('opacity-0'));
  clearTimeout(errorTimeout);
  errorTimeout = setTimeout(hideError, 5000);
}

function hideError() {
  errorToast.classList.add('opacity-0');
  setTimeout(() => errorToast.classList.add('hidden'), 300);
}

// 智慧探測該車牌資料夾內的照片
async function fetchPlatePhotos(plate) {
  const folderUrl = `${NAS_DOMAIN}/carpuse_events/${plate}/`;
  
  // 嘗試透過 WebDAV 或目錄列表抓取檔案清單
  try {
    const response = await fetch(folderUrl, { method: 'GET' });
    if (!response.ok) throw new Error('找不到該車牌專屬資料夾');
    
    const text = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, 'text/html');
    
    // 從頁面連結中提取圖片檔名 (.jpg, .jpeg, .png, .webp)
    const links = doc.querySelectorAll('a');
    let photos = [];
    
    links.forEach(a => {
      const href = a.getAttribute('href');
      if (href && /\.(jpg|jpeg|png|webp)$/i.test(href)) {
        // 排除絕對路徑，只取檔名
        const fileName = href.split('/').pop();
        if (fileName) {
          photos.push({
            url: `${folderUrl}${fileName}`,
            title: fileName
          });
        }
      }
    });

    return photos;
  } catch (err) {
    console.warn('無法直接讀取目錄清單，啟動備用探測機制...');
    
    // 備用方案：若 NAS 未直接開啟目錄列表，測試常見相機命名編號 (如 1 ~ 30 張)
    let photos = [];
    const commonPrefixes = ['IMG_', 'DSC_', 'PHOTO_', ''];
    
    // 我們可以依序探測前幾張照片是否存在
    for (let prefix of commonPrefixes) {
      for (let i = 1; i <= 20; i++) {
        const numStr = String(i).padStart(4, '0'); // 0001, 0002...
        const fileName = `${prefix}${numStr}.jpg`;
        const testUrl = `${folderUrl}${fileName}`;
        
        try {
          const check = await fetch(testUrl, { method: 'HEAD' });
          if (check.ok) {
            photos.push({ url: testUrl, title: fileName });
          }
        } catch(e) {}
      }
    }
    return photos;
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  gallerySection.classList.add('hidden');
  resultsContainer.innerHTML = '';

  let plate = plateInput.value.trim().toUpperCase().replace(/\s+/g, '');
  if (!plate) {
    showError('請輸入有效的車牌號碼');
    return;
  }

  submitBtn.disabled = true;
  btnText.textContent = '正在調閱相簿...';
  btnSpinner.classList.remove('hidden');

  try {
    const photos = await fetchPlatePhotos(plate);
    
    if (photos.length === 0) {
      showError(`找不到車牌「${plate}」的相片，請確認資料夾與檔名是否正確。`);
    } else {
      targetPlateSpan.textContent = plate;
      renderGallery(photos);
    }
  } catch (err) {
    showError('連線至 NAS 讀取相片時發生錯誤，請稍後再試');
  } finally {
    submitBtn.disabled = false;
    btnText.textContent = '立即查詢影像';
    btnSpinner.classList.add('hidden');
  }
});

function renderGallery(photos) {
  resultsContainer.innerHTML = '';
  photos.forEach(photo => {
    const div = document.createElement('div');
    div.className = 'masonry-item bg-gray-900 rounded-xl overflow-hidden border border-gray-800 shadow-lg group cursor-pointer';
    div.innerHTML = `
      <div class="overflow-hidden relative aspect-[4/3]">
        <img src="${photo.url}" alt="${photo.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/800x600/13151f/ffffff?text=Image+Load+Error'">
        <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent opacity-0 group-hover:opacity-100 transition flex items-end p-4">
          <span class="text-xs text-white font-medium">點擊放大檢視 (${photo.title})</span>
        </div>
      </div>
    `;
    div.addEventListener('click', () => {
      lightboxImg.src = photo.url;
      downloadBtn.href = photo.url;
      lightboxModal.classList.remove('hidden');
      setTimeout(() => lightboxModal.classList.remove('opacity-0'), 10);
    });
    resultsContainer.appendChild(div);
  });
  gallerySection.classList.remove('hidden');
}

closeLightbox.addEventListener('click', () => {
  lightboxModal.classList.add('opacity-0');
  setTimeout(() => lightboxModal.classList.add('hidden'), 300);
});

lightboxModal.addEventListener('click', (e) => {
  if (e.target === lightboxModal) closeLightbox.click();
});
</script>
</body>
</html>
