<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CARPULSE 車聚影像管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { darkbg: '#090a0f' }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-[#090a0f] text-gray-100 flex flex-col justify-between selection:bg-blue-600 selection:text-white">
  
  <header class="border-b border-gray-800 bg-[#0c0e15]/80 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-purple-500/30">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-wider text-white">CARPULSE Admin</h1>
          <p class="text-xs text-gray-400">車聚系統管理後台</p>
        </div>
      </div>
      <a href="/" class="text-xs font-medium text-gray-400 hover:text-white bg-gray-800/60 hover:bg-gray-800 px-3 py-1.5 rounded-lg border border-gray-700 transition">返回前台查詢</a>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 w-full">
    
    <!-- Login Screen -->
    <div id="login-container" class="max-w-md mx-auto mt-16 bg-[#13151f] border border-gray-800/80 rounded-2xl p-8 shadow-2xl">
      <h2 class="text-xl font-bold text-white mb-2 text-center">管理員身分驗證</h2>
      <p class="text-xs text-gray-400 mb-6 text-center">請輸入後台管理密碼以存取資料</p>
      
      <form id="login-form" class="space-y-4">
        <div>
          <input type="password" id="admin-pwd" placeholder="請輸入管理密碼 (例如: admin1234)" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-purple-500 transition font-mono" required>
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-medium py-3 px-4 rounded-xl shadow-lg transition">進入後台</button>
      </form>
      <p id="login-error" class="text-red-400 text-xs mt-3 text-center hidden">密碼錯誤，請重新輸入</p>
    </div>

    <!-- Admin Panel Dashboard (Hidden by default) -->
    <div id="dashboard-container" class="hidden space-y-8">
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-white">車牌與影像對應管理</h2>
          <p class="text-sm text-gray-400">在此檢視、新增或編輯前台對應的車牌、PIN 碼與相片連結。</p>
        </div>
        <button id="add-record-btn" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-medium px-4 py-2.5 rounded-xl shadow transition flex items-center justify-center space-x-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
          <span>新增一筆對應資料</span>
        </button>
      </div>

      <!-- Data Table -->
      <div class="bg-[#13151f] border border-gray-800 rounded-2xl overflow-hidden shadow-xl">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-gray-800 text-xs font-semibold text-gray-400 uppercase bg-gray-900/50">
                <th class="py-4 px-6">車牌號碼 (Plate)</th>
                <th class="py-4 px-6">PIN 碼</th>
                <th class="py-4 px-6">照片數量</th>
                <th class="py-4 px-6 text-right">操作</th>
              </tr>
            </thead>
            <tbody id="records-table-body" class="divide-y divide-gray-800 text-sm">
              <tr>
                <td class="py-4 px-6 font-mono text-white">ABC-1234</td>
                <td class="py-4 px-6 font-mono text-gray-400">8888</td>
                <td class="py-4 px-6 text-gray-300">3 張照片</td>
                <td class="py-4 px-6 text-right space-x-2">
                  <button class="text-blue-400 hover:underline text-xs font-medium">編輯</button>
                  <button class="text-red-400 hover:underline text-xs font-medium">刪除</button>
                </td>
              </tr>
              <tr>
                <td class="py-4 px-6 font-mono text-white">XX-9999</td>
                <td class="py-4 px-6 font-mono text-gray-400">1234</td>
                <td class="py-4 px-6 text-gray-300">1 張照片</td>
                <td class="py-4 px-6 text-right space-x-2">
                  <button class="text-blue-400 hover:underline text-xs font-medium">編輯</button>
                  <button class="text-red-400 hover:underline text-xs font-medium">刪除</button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-800/80 bg-[#090a0f] py-6 text-center text-xs text-gray-500">
    <p>&copy; 2026 CARPULSE. All rights reserved. Admin Management Panel.</p>
  </footer>

  <!-- Admin Script -->
  <script>
    const loginForm = document.getElementById('login-form');
    const loginContainer = document.getElementById('login-container');
    const dashboardContainer = document.getElementById('dashboard-container');
    const adminPwdInput = document.getElementById('admin-pwd');
    const loginError = document.getElementById('login-error');

    // 處理登入邏輯
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pwd = adminPwdInput.value.trim();
      
      // 這裡設定了兩組測試密碼
      if (pwd === 'admin1234' || pwd === 'carpulse2026') {
        loginContainer.classList.add('hidden');
        dashboardContainer.classList.remove('hidden');
      } else {
        loginError.classList.remove('hidden');
        adminPwdInput.classList.add('border-red-500');
        
        // 3秒後隱藏錯誤訊息
        setTimeout(() => {
          loginError.classList.add('hidden');
          adminPwdInput.classList.remove('border-red-500');
        }, 3000);
      }
    });

    // 處理新增資料按鈕點擊 (僅作展示)
    document.getElementById('add-record-btn').addEventListener('click', () => {
      // 在實際應用中，這會開啟一個 Modal 表單讓管理員輸入新資料
      const tbody = document.getElementById('records-table-body');
      const newRow = document.createElement('tr');
      newRow.innerHTML = `
        <td class="py-4 px-6 font-mono text-white">NEW-0000</td>
        <td class="py-4 px-6 font-mono text-gray-400">0000</td>
        <td class="py-4 px-6 text-gray-300">0 張照片</td>
        <td class="py-4 px-6 text-right space-x-2">
          <button class="text-blue-400 hover:underline text-xs font-medium">編輯</button>
          <button class="text-red-400 hover:underline text-xs font-medium">刪除</button>
        </td>
      `;
      tbody.prepend(newRow);
    });
  </script>
</body>
</html>
